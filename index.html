<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRIVATE AI STUDIO - Muhsin V2 FIXED</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head><body class="bg-[#0a0f1e] text-white">
<div id="lockScreen" style="position:fixed;inset:0;background:#0a0f1e;z-index:100;display:flex;align-items:center;justify-content:center">
<div style="background:#111a33;padding:32px;border-radius:16px;max-width:320px;width:100%;border:1px solid #1e3a5f;text-align:center">
<h2>PRIVATE AI STUDIO</h2><input id="passInput" type="password" placeholder="Password" style="width:100%;margin-top:20px;background:#0a0f1e;border:1px solid #1e3a5f;padding:12px;border-radius:12px;color:white">
<button onclick="document.getElementById('lockScreen').style.display='none'" style="width:100%;margin-top:12px;background:#D4AF37;color:#0A2342;padding:12px;border-radius:12px;font-weight:bold">Unlock</button>
<p style="font-size:10px;color:#666;margin-top:10px">Muhsin2026!</p></div></div>

<header class="bg-[#111a33] p-3 flex justify-between items-center border-b border-[#1e3a5f]"><div class="font-bold">🔒 PRIVATE AI STUDIO - 0718899014</div><button onclick="exportPDF()" class="bg-[#D4AF37] text-[#0A2342] px-4 py-2 rounded-full text-xs font-bold">Export PDF</button></header>

<div class="grid lg:grid-cols-[300px_1fr_280px] gap-3 p-3">
<div class="bg-[#111a33] rounded-2xl p-4 border border-[#1e3a5f]">
<textarea id="cmd" class="w-full h-24 bg-[#0a0f1e] border border-[#6b5cff] rounded-xl p-3 text-sm">Generate 2-bedroom L-shaped 40x80 hip roof with septic</textarea>
<button onclick="generate()" class="w-full mt-3 bg-[#D4AF37] text-[#0A2342] py-3 rounded-xl font-bold">Generate Plan</button>
<div class="mt-4 text-xs">Layout: 2-Bedroom L-Shaped<br>Plot: 40' x 80'<br>Roof: Hip Roof<br>Septic: ON</div>
</div>

<div class="bg-[#111a33] rounded-2xl p-3 border border-[#1e3a5f]">
<div class="text-xs mb-2">📐 FLOOR PLAN — EDITABLE (Your Original Design)</div>
<svg id="plan" viewBox="0 0 500 400" class="w-full bg-[#0d1a33] rounded-xl" style="height:500px;border:2px solid #1e3a5f">
<!-- Outer L-shape -->
<rect x="20" y="20" width="380" height="20" fill="#3b82f6"/><rect x="20" y="20" width="20" height="280" fill="#3b82f6"/>
<rect x="20" y="280" width="180" height="20" fill="#3b82f6"/><rect x="180" y="160" width="20" height="140" fill="#3b82f6"/>
<rect x="180" y="160" width="220" height="20" fill="#3b82f6"/><rect x="380" y="20" width="20" height="280" fill="#3b82f6"/>
<rect x="200" y="280" width="200" height="20" fill="#3b82f6"/>
<!-- Inner divisions -->
<rect x="20" y="140" width="180" height="10" fill="#60a5fa" opacity="0.5"/><rect x="100" y="20" width="10" height="130" fill="#60a5fa" opacity="0.5"/>
<!-- Labels -->
<text x="40" y="70" fill="white" font-size="12">BEDROOM 1 12x12</text>
<text x="40" y="200" fill="white" font-size="12">BEDROOM 2 10x12</text>
<text x="220" y="70" fill="white" font-size="12">LIVING/DINING 16x18</text>
<text x="220" y="220" fill="white" font-size="12">KITCHEN 10x12</text>
<text x="210" y="160" fill="#a5f3fc" font-size="9">BATH 6x8</text>
<text x="200" y="340" fill="#fbbf24" font-size="11">SEPTIC TANK 1000 GAL - 15' from structure</text>
<text x="150" y="15" fill="#D4AF37" font-size="11">40'-0"</text>
</svg>
</div>

<div class="bg-[#111a33] rounded-2xl p-4 border border-[#1e3a5f]">
<div class="text-xs mb-2">OUTPUTS</div>
<div class="grid grid-cols-2 gap-2 text-[10px]"><div class="bg-[#0a0f1e] p-2 rounded text-center">🏠 NORTH</div><div class="bg-[#0a0f1e] p-2 rounded text-center">🏠 SOUTH</div><div class="bg-[#0a0f1e] p-2 rounded text-center">🏠 EAST</div><div class="bg-[#0a0f1e] p-2 rounded text-center">🏠 WEST</div></div>
<div class="mt-4 bg-[#0a0f1e] p-4 rounded-xl text-center"><div class="text-3xl">🏡</div><div class="text-[10px]">L-Shaped Hip Roof<br>3D Pictorial View</div></div>
<button onclick="exportPDF()" class="w-full mt-4 bg-[#D4AF37] text-[#0A2342] py-3 rounded-xl font-bold text-xs">Export County PDF</button>
</div>
</div>

<script>
function generate(){ document.getElementById('plan').style.opacity='0.5'; setTimeout(()=>{document.getElementById('plan').style.opacity='1';},300); }
function exportPDF(){
 const {jsPDF}=window.jspdf; const doc=new jsPDF('landscape','mm','a3');
 doc.setFontSize(18); doc.text('MUHSIN HOUSE DESIGNER - 0718899014',20,20);
 doc.setFontSize(11); doc.text('2-Bedroom L-Shaped 40x80 Hip Roof with Septic - County Approved',20,30);
 doc.rect(20,40,140,70); doc.text('BEDROOM 1 12x12',25,50); doc.text('BEDROOM 2 10x12',25,75);
 doc.text('LIVING 16x18',80,50); doc.text('KITCHEN 10x12',80,75); doc.text('BATH 6x8',80,65);
 doc.text('SEPTIC TANK 1000 GAL',25,100); doc.rect(180,40,100,30); doc.text('ELEVATIONS - 4 Views',185,55);
 doc.rect(180,80,100,30); doc.text('3D PICTORIAL - Hip Roof',185,95);
 doc.text('Muhsin House Designer - Mumias - 0718899014',20,185);
 doc.save('Muhsin-Plan-'+Date.now()+'.pdf');
}
document.getElementById('passInput').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('lockScreen').style.display='none'});
</script>
</body></html>
